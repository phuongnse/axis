# The login theme of the sample realm `company`, which plays an organization's own identity provider that the `axis`
# realm brokers to. It looks like another company's sign-in on purpose, so a person sees that they left Axis. It keeps
# Keycloak's templates and messages, and changes only the styles. It is sample data and never ships.
parent=keycloak
import=common/keycloak
styles=css/login.css css/example-company.css
