# Production Compose example: the server, the worker and the publisher run from the production images,
# Axis's identity provider (Keycloak with the Axis theme) runs beside them, and the admin tool runs only on demand.
# PostgreSQL 18 runs elsewhere and holds the identity provider's own database. Tenants come from the tenant
# directory. Every secret is a file under secrets:, mounted in /run/secrets. This file holds no
# password, client secret or key. See docs/reference/installation.md#on-premises for the steps.
# compose.scenarios.yaml is an optional second file that turns on test scenarios.
#
# AXIS_VERSION          Required. The tag of the three images.
# AXIS_IMAGE_PREFIX     Optional. A registry prefix for the image names, such as registry.example.com/axis/.
# AXIS_SECRETS_DIR      The folder with the secret files. Default ./secrets.
# AXIS_EXTENSIONS_DIR   The extension packages, mounted at /extensions. Default ./extensions.
# AXIS_MODULES_DIR      The modules, mounted at /modules. Default ./modules.
# AXIS_STUDIO_DIR       The Studio folders, mounted read-write at /studio on both servers. Default ./studio. It must
#                       be writable by UID 1654.
# AXIS_APPS_DIR         The application folders for `activate`, mounted at /apps. Default ./apps.
# AXIS_SERVER_TLS_DIR   The folder with tls.crt and tls.key of the servers, issued for the name `servers`, mounted
#                       read-only at /server-tls on both servers only. UID 1654 must read both files. Default
#                       ./server-tls. The servers listen on HTTPS only, and the server does not start without it.
# AXIS_SERVER_PORT      The host port of the server, on 127.0.0.1 only. Default 8080. It serves HTTPS, so a client
#                       checks the certificate for the name `servers`.
# AXIS_WORKER_HEALTH_PORT  The host port of the worker's health endpoints, on 127.0.0.1 only. Default 5208.
# AXIS_TLS_DIR          The folder with tls.crt and tls.key for the proxy, mounted read-only at /certs. Default ./tls.
#                       It also holds server-ca.crt, the one authority certificate that the proxy trusts for the servers.
# AXIS_HTTPS_PORT       The host port of the proxy. Default 443.
# AXIS_IDENTITY_HOST    Required. The one public host name of the identity provider. The proxy sends requests for it to
#                       the identity provider and every other host to the servers. Its certificate must cover this name.
# AXIS_IDENTITY_TLS_DIR The folder with tls.crt and tls.key of the identity provider, issued for the name `identity`,
#                       mounted read-only at /identity-tls on the identity provider only. UID 1000 must read both
#                       files. Default ./identity-tls.
# AXIS_IDENTITY_THEME_DIR  The built Axis login theme, the output of `npm run build:keycloak-theme --prefix web`,
#                       mounted read-only at /opt/keycloak/themes. Default ./keycloak-theme.
# AXIS_PASSWORD_BLACKLISTS_DIR  The breached-password list that every realm checks, mounted read-only at
#                       /opt/keycloak/data/password-blacklists. Default ../keycloak/password-blacklists.
# AXIS_SERVER_2_PORT    The host port of the second server replica, on 127.0.0.1 only. Default 8081.
# AXIS_NETWORK_SUBNET   The subnet of the Compose network. Default 172.31.250.0/24. Change it when it overlaps a
#                       network of the machine.
# AXIS_NETWORK_IP_RANGE The part of the subnet that Docker hands out to containers without a fixed address.
#                       Default 172.31.250.128/25. It must not hold AXIS_PROXY_ADDRESS.
# AXIS_PROXY_ADDRESS    The fixed address of the proxy in the subnet. Both servers trust the forwarded headers
#                       from this address only. Default 172.31.250.10.
#
# Profiles. `replicas` starts the second server, server-2. `admin` is for `docker compose run --rm admin`. The
# TLS proxy and the identity provider have no profile, so `docker compose up` starts them.
# AXIS_OIDC_CLIENT_SECRET  Passes through from the shell to `tenant restore` and `tenant oidc set`. It is never stored here.
# Studio__Folders__0, Studio__AuthorRole, Studio__PublisherRole  Pass through from the shell to both servers.
#                       Studio stays off without them.
x-host: &host
  read_only: true
  tmpfs:
    - /tmp
  environment: &host-environment
    Tenancy__Source: directory
    Extensions__Path: /extensions
    Modules__Path: /modules

# The server and its second replica. Both trust forwarded headers from the proxy's fixed address only, and
# both answer to the network alias `servers`, which the proxy looks up.
x-server: &server
  <<: *host
  image: ${AXIS_IMAGE_PREFIX:-}axis-server:${AXIS_VERSION:?Set AXIS_VERSION}
  restart: unless-stopped
  environment:
    <<: *host-environment
    ForwardedHeaders__KnownProxies__0: ${AXIS_PROXY_ADDRESS:-172.31.250.10}
    # HTTPS only. A Kestrel endpoint replaces the plain HTTP port 8080 of the image, so nothing listens on it.
    Kestrel__Endpoints__Https__Url: https://+:8443
    Kestrel__Endpoints__Https__Certificate__Path: /server-tls/tls.crt
    Kestrel__Endpoints__Https__Certificate__KeyPath: /server-tls/tls.key
    # No value: these pass through from the shell. Studio stays off without them.
    Studio__Folders__0:
    Studio__AuthorRole:
    Studio__PublisherRole:
  networks:
    default:
      aliases:
        - servers
  volumes:
    - ${AXIS_EXTENSIONS_DIR:-./extensions}:/extensions:ro
    - ${AXIS_MODULES_DIR:-./modules}:/modules:ro
    # Read-write, and the same folder on every replica, because the write lock is keyed by the folder path.
    - ${AXIS_STUDIO_DIR:-./studio}:/studio
    # The certificate and the private key of the servers. No other service mounts them.
    - ${AXIS_SERVER_TLS_DIR:-./server-tls}:/server-tls:ro
  secrets:
    - ConnectionStrings__Platform
    - ConnectionStrings__PlatformSchema
    - Platform__SecretKey

services:
  server:
    <<: *server
    ports:
      - "127.0.0.1:${AXIS_SERVER_PORT:-8080}:8443"

  # The second replica. Start it only after `server` is ready.
  server-2:
    <<: *server
    profiles:
      - replicas
    ports:
      - "127.0.0.1:${AXIS_SERVER_2_PORT:-8081}:8443"

  # Axis's identity provider: Keycloak at the version that development and the tests use, with the Axis theme and
  # the breached-password list. It keeps its data in its own database on the PostgreSQL server and listens on
  # HTTPS only, on port 8443, with a certificate for the name `identity`. It publishes no port: the proxy is the
  # only way in. The database settings come from secret files, which the entrypoint turns into Keycloak's
  # variables, because Keycloak has no _FILE variables. The admin client axis-admin is the bootstrap client of the
  # master realm, with the same secret file that the admin tool reads. Keycloak rebuilds itself at start and
  # writes into its image, so this service has no read-only root file system.
  identity:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    entrypoint: [bash, /opt/axis/identity-entrypoint.sh]
    command: [start]
    environment:
      KC_DB: postgres
      KC_HOSTNAME: https://${AXIS_IDENTITY_HOST:?Set AXIS_IDENTITY_HOST}
      KC_HTTPS_CERTIFICATE_FILE: /identity-tls/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /identity-tls/tls.key
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${AXIS_PROXY_ADDRESS:-172.31.250.10}
      KC_BOOTSTRAP_ADMIN_CLIENT_ID: axis-admin
    volumes:
      - ./identity-entrypoint.sh:/opt/axis/identity-entrypoint.sh:ro
      - ${AXIS_IDENTITY_THEME_DIR:-./keycloak-theme}:/opt/keycloak/themes:ro
      - ${AXIS_PASSWORD_BLACKLISTS_DIR:-../keycloak/password-blacklists}:/opt/keycloak/data/password-blacklists:ro
      # The certificate and the private key of the identity provider. No other service mounts them.
      - ${AXIS_IDENTITY_TLS_DIR:-./identity-tls}:/identity-tls:ro
    secrets:
      - KC_DB_URL
      - KC_DB_USERNAME
      - KC_DB_PASSWORD
      - IdentityProvider__AdminClientSecret

  # Ends TLS with /certs/tls.crt and /certs/tls.key. It forwards requests for AXIS_IDENTITY_HOST to the identity
  # provider and every other host to every server that answers to `servers`, both over TLS. It trusts only
  # /certs/server-ca.crt for them. The network alias AXIS_IDENTITY_HOST lets the servers, the publisher and the
  # admin tool reach the identity provider at the same public address as a browser. It holds no secret: the
  # folder is mounted from the host.
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data
      - /config
    ports:
      - "${AXIS_HTTPS_PORT:-443}:443"
    environment:
      AXIS_IDENTITY_HOST: ${AXIS_IDENTITY_HOST:?Set AXIS_IDENTITY_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${AXIS_TLS_DIR:-./tls}:/certs:ro
    networks:
      default:
        ipv4_address: ${AXIS_PROXY_ADDRESS:-172.31.250.10}
        aliases:
          - ${AXIS_IDENTITY_HOST:?Set AXIS_IDENTITY_HOST}

  worker:
    <<: *host
    image: ${AXIS_IMAGE_PREFIX:-}axis-worker:${AXIS_VERSION:?Set AXIS_VERSION}
    restart: unless-stopped
    environment:
      <<: *host-environment
      # All interfaces inside the container. The published port stays on 127.0.0.1.
      Health__Urls: http://0.0.0.0:5208
    ports:
      - "127.0.0.1:${AXIS_WORKER_HEALTH_PORT:-5208}:5208"
    volumes:
      - ${AXIS_EXTENSIONS_DIR:-./extensions}:/extensions:ro
      - ${AXIS_MODULES_DIR:-./modules}:/modules:ro
    # The worker never gets the schema connection string.
    secrets:
      - ConnectionStrings__Platform
      - Platform__SecretKey

  # Runs the publish requests that Studio stores. It listens on no port.
  publisher:
    <<: *host
    image: ${AXIS_IMAGE_PREFIX:-}axis-admin:${AXIS_VERSION:?Set AXIS_VERSION}
    command: ["publisher"]
    restart: unless-stopped
    # Longer than the five-minute lease, so a stop lets the running request finish.
    stop_grace_period: 6m
    volumes:
      - ${AXIS_EXTENSIONS_DIR:-./extensions}:/extensions:ro
      - ${AXIS_MODULES_DIR:-./modules}:/modules:ro
    secrets:
      - ConnectionStrings__PlatformSchema
      - Platform__SecretKey

  # Runs only through `docker compose run --rm admin <command>`, so `docker compose up` does not start it.
  admin:
    <<: *host
    image: ${AXIS_IMAGE_PREFIX:-}axis-admin:${AXIS_VERSION:?Set AXIS_VERSION}
    profiles:
      - admin
    environment:
      <<: *host-environment
      # No value: this passes through from the shell.
      AXIS_OIDC_CLIENT_SECRET:
      # `tenant create` creates each tenant's realm in the identity provider, at its public address.
      IdentityProvider__Url: https://${AXIS_IDENTITY_HOST:?Set AXIS_IDENTITY_HOST}/
      IdentityProvider__AdminClientId: axis-admin
    volumes:
      - ${AXIS_EXTENSIONS_DIR:-./extensions}:/extensions:ro
      - ${AXIS_MODULES_DIR:-./modules}:/modules:ro
      - ${AXIS_APPS_DIR:-./apps}:/apps:ro
    secrets:
      - Admin__ConnectionString
      - ConnectionStrings__PlatformSchema
      - IdentityProvider__AdminClientSecret
      - Platform__SecretKey

# A fixed subnet gives the proxy a fixed address. Docker hands out the other addresses from the ip_range only,
# so a short-lived container cannot take the proxy's address.
networks:
  default:
    ipam:
      config:
        - subnet: ${AXIS_NETWORK_SUBNET:-172.31.250.0/24}
          ip_range: ${AXIS_NETWORK_IP_RANGE:-172.31.250.128/25}

# One file per setting, named like the setting. Compose mounts each at /run/secrets/<name>.
secrets:
  Admin__ConnectionString:
    file: ${AXIS_SECRETS_DIR:-./secrets}/Admin__ConnectionString
  ConnectionStrings__Platform:
    file: ${AXIS_SECRETS_DIR:-./secrets}/ConnectionStrings__Platform
  ConnectionStrings__PlatformSchema:
    file: ${AXIS_SECRETS_DIR:-./secrets}/ConnectionStrings__PlatformSchema
  IdentityProvider__AdminClientSecret:
    file: ${AXIS_SECRETS_DIR:-./secrets}/IdentityProvider__AdminClientSecret
  KC_DB_PASSWORD:
    file: ${AXIS_SECRETS_DIR:-./secrets}/KC_DB_PASSWORD
  KC_DB_URL:
    file: ${AXIS_SECRETS_DIR:-./secrets}/KC_DB_URL
  KC_DB_USERNAME:
    file: ${AXIS_SECRETS_DIR:-./secrets}/KC_DB_USERNAME
  Platform__SecretKey:
    file: ${AXIS_SECRETS_DIR:-./secrets}/Platform__SecretKey
