# The publisher has no HTTP endpoint, so it has no port, probe or Service.
# It always runs one replica, and Recreate never runs two during a rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-publisher
  labels:
    {{- include "axis.labels" . | nindent 4 }}
    app.kubernetes.io/component: publisher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "axis.selectorLabels" (dict "root" . "component" "publisher") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axis.labels" . | nindent 8 }}
        app.kubernetes.io/component: publisher
    spec:
      {{- if and .Values.cell.id .Values.cell.certificate.enabled }}
      {{- /* The token lets the publisher create the Certificate of a verified tenant host, see publisher-rbac.yaml. */}}
      serviceAccountName: {{ .Release.Name }}-publisher
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      # Longer than the five-minute lease, so a stop lets the running request finish.
      terminationGracePeriodSeconds: {{ .Values.publisher.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- include "axis.podSecurityContext" . | nindent 8 }}
      containers:
        - name: publisher
          image: {{ include "axis.image" (dict "root" . "repository" .Values.migrate.repository) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - publisher
          env:
            {{- if .Values.cell.id }}
            {{- /* The create job runs in this pod, and it reads the cell's backup key from its own mount, not from cell.backupKeyFile. */}}
            {{- $values := mergeOverwrite (deepCopy .Values) (dict "cell" (dict "backupKeyFile" "/cell-backup-key/key")) }}
            {{- include "axis.hostEnv" (dict "Values" $values) | nindent 12 }}
            - name: IdentityProvider__Url
              value: {{ printf "https://%s/" (required "identity.hostname is required in a cell: the host name of the identity provider" .Values.identity.hostname) | quote }}
            - name: IdentityProvider__AdminClientId
              value: axis-admin
            # The Studio volume of the server, so the applications that the create job writes are the ones Studio shows.
            - name: Studio__ApplicationsPath
              value: /studio
            - name: Templates__Path
              value: /templates
            {{- if .Values.cell.certificate.enabled }}
            - name: Cell__HostCertificateIssuer
              value: {{ printf "%s-tenant-hosts" .Release.Name | quote }}
            {{- end }}
            {{- else }}
            {{- include "axis.hostEnv" . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- include "axis.containerSecurityContext" . | nindent 12 }}
          {{- with .Values.publisher.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "axis.volumeMounts" . | nindent 12 }}
            {{- if .Values.cell.id }}
            - name: cell-backup-key
              mountPath: /cell-backup-key
              readOnly: true
            - name: studio
              mountPath: /studio
            - name: templates
              mountPath: /templates
              readOnly: true
            {{- end }}
      volumes:
        {{- $entries := list "platformSchemaConnection" "platformSecretKey" }}
        {{- if .Values.cell.id }}
        {{- $entries = concat $entries (list "adminConnection" "identityAdminClientSecret") }}
        {{- end }}
        {{- if .Values.secrets.scenarioServerConnection.name }}
        {{- $entries = append $entries "scenarioServerConnection" }}
        {{- end }}
        {{- include "axis.volumes" (dict "root" . "entries" $entries) | nindent 8 }}
        {{- if .Values.cell.id }}
        - name: cell-backup-key
          secret:
            secretName: {{ required "secrets.cellBackupKey.name is required in a cell: the Kubernetes Secret that holds the cell's backup key" .Values.secrets.cellBackupKey.name | quote }}
            defaultMode: 292
            items:
              - key: {{ .Values.secrets.cellBackupKey.key | default "cell-backup-key" | quote }}
                path: key
        - name: studio
          {{- toYaml (required "studio.persistence is required in a cell: a ReadWriteMany volume source that the server and the publisher mount at /studio" .Values.studio.persistence) | nindent 10 }}
        - name: templates
          {{- toYaml (required "templates.volume is required in a cell: the installed templates, mounted read-only at /templates" .Values.templates.volume) | nindent 10 }}
        {{- end }}
