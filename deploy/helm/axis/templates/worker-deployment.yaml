apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "axis.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "axis.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axis.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- include "axis.podSecurityContext" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "axis.image" (dict "root" . "repository" .Values.worker.repository) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "axis.hostEnv" . | nindent 12 }}
            {{- with include "axis.pgbouncerEnv" . }}
            {{- . | nindent 12 }}
            {{- end }}
            # The image keeps the health address on loopback. The kubelet probes the pod address.
            - name: Health__Urls
              value: http://0.0.0.0:5208
            # The package hosts, see docs/reference/extension-packages.md#package-runners.
            {{- range $runtime, $_ := include "axis.packageHostRuntimes" . | fromYaml }}
            - name: Extensions__Runners__{{ title $runtime }}
              value: {{ printf "%s-package-host-%s:5310" $.Release.Name $runtime | quote }}
            {{- end }}
            {{- /* The application package host, see docs/reference/extension-packages.md#an-applications-packages. */}}
            {{- with include "axis.applicationRunnerEnv" . }}
            {{- . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: 5208
          {{- include "axis.probes" "health" | nindent 10 }}
          securityContext:
            {{- include "axis.containerSecurityContext" . | nindent 12 }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "axis.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "axis.volumes" (dict "root" . "entries" (list "platformConnection" "platformSecretKey")) | nindent 8 }}
