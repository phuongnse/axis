{{- range $component, $host := include "axis.packageHosts" . | fromYaml }}
{{- $values := $.Values }}
{{- range splitList "." $host.values }}{{- $values = index $values . | default dict }}{{- end }}
---
# A package host, see docs/reference/extension-packages.md#package-runners. It gets no env entry, no credential and no
# service account token, and it has no health endpoint, so it has no probe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  labels:
    {{- include "axis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $values.replicas }}
  selector:
    matchLabels:
      {{- include "axis.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axis.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      {{- if $host.sandbox }}
      # The application package host runs tenant code, so it runs under gVisor, see
      # docs/reference/extension-packages.md#an-applications-packages and threat P145 of
      # docs/reference/threat-model-product.md. The package hosts of the runtimes set no runtimeClassName.
      runtimeClassName: {{ required "applicationPackageHost.runtimeClassName is required: the RuntimeClass of gVisor that the application package host runs under" $values.runtimeClassName | quote }}
      {{- end }}
      automountServiceAccountToken: false
      # Kubernetes otherwise adds the address of every Service to the environment.
      enableServiceLinks: false
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- include "axis.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: {{ $component }}
          image: {{ include "axis.image" (dict "root" $ "repository" $values.repository) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - host
          ports:
            - name: runner
              containerPort: 5310
          securityContext:
            {{- include "axis.containerSecurityContext" $ | nindent 12 }}
          {{- /* A nil-safe lookup, so a removed limit fails with its name. */}}
          {{- $limits := ($values.resources | default dict).limits | default dict }}
          {{- $_ := required (printf "%s.resources.limits.cpu is required: the CPU limit of %s" $host.values $host.label) $limits.cpu }}
          {{- $_ := required (printf "%s.resources.limits.memory is required: the memory limit of %s" $host.values $host.label) $limits.memory }}
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          volumeMounts:
            {{- include "axis.tmpAndExtensionsVolumeMounts" $ | nindent 12 }}
      volumes:
        {{- include "axis.tmpAndExtensionsVolumes" $ | nindent 8 }}
{{- end }}
