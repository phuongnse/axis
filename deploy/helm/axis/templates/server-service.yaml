apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "axis.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "axis.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.server.service.port }}
      targetPort: https
