{{- range $component, $host := include "axis.packageHosts" . | fromYaml }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  labels:
    {{- include "axis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    {{- include "axis.selectorLabels" (dict "root" $ "component" $component) | nindent 4 }}
  ports:
    - name: runner
      port: 5310
      targetPort: runner
{{- end }}
