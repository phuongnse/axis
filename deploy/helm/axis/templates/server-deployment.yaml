{{- if and .Values.studio.folders (not .Values.studio.persistence) }}
{{- fail "studio.persistence is required when studio.folders is set: a ReadWriteMany volume source that every server replica mounts at /studio" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "axis.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "axis.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axis.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- include "axis.podSecurityContext" . | nindent 8 }}
      containers:
        - name: server
          image: {{ include "axis.image" (dict "root" . "repository" .Values.server.repository) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "axis.hostEnv" . | nindent 12 }}
            # HTTPS only: a Kestrel endpoint list replaces the plain HTTP port of the image.
            - name: Kestrel__Endpoints__Https__Url
              value: https://+:8443
            - name: Kestrel__Endpoints__Https__Certificate__Path
              value: /server-tls/tls.crt
            - name: Kestrel__Endpoints__Https__Certificate__KeyPath
              value: /server-tls/tls.key
            {{- range $i, $folder := .Values.studio.folders }}
            - name: Studio__Folders__{{ $i }}
              value: {{ printf "/studio/%s" $folder | quote }}
            {{- end }}
            {{- with .Values.studio.authorRole }}
            - name: Studio__AuthorRole
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.studio.publisherRole }}
            - name: Studio__PublisherRole
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.studio.tests }}
            - name: Studio__Tests
              value: "true"
            {{- end }}
            {{- range $i, $proxy := .Values.forwardedHeaders.knownProxies }}
            - name: ForwardedHeaders__KnownProxies__{{ $i }}
              value: {{ $proxy | quote }}
            {{- end }}
            {{- range $i, $network := .Values.forwardedHeaders.knownNetworks }}
            - name: ForwardedHeaders__KnownNetworks__{{ $i }}
              value: {{ $network | quote }}
            {{- end }}
          ports:
            - name: https
              containerPort: 8443
          {{- include "axis.probes" "https" | nindent 10 }}
          securityContext:
            {{- include "axis.containerSecurityContext" . | nindent 12 }}
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "axis.volumeMounts" . | nindent 12 }}
            - name: server-tls
              mountPath: /server-tls
              readOnly: true
            {{- if .Values.studio.folders }}
            - name: studio
              mountPath: /studio
            {{- end }}
      volumes:
        {{- include "axis.volumes" (dict "root" . "entries" (list "platformConnection" "platformSchemaConnection" "platformSecretKey")) | nindent 8 }}
        - name: server-tls
          secret:
            secretName: {{ required "secrets.serverCertificate.name is required: the Kubernetes TLS Secret (tls.crt, tls.key) of the server's HTTPS endpoint" .Values.secrets.serverCertificate.name | quote }}
            # Readable by the non-root user of the image.
            defaultMode: 292
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- if .Values.studio.folders }}
        - name: studio
          {{- toYaml .Values.studio.persistence | nindent 10 }}
        {{- end }}
