# Values of the Axis chart. See docs/reference/installation.md.
# PostgreSQL and the source of secrets are external. The chart runs Axis's identity provider.

image:
  # Registry prefix of the three images, such as "registry.example.com/axis".
  # Empty uses the repository names as they are.
  registry: ""
  # The tag of all three images. Empty uses the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  # Names of image pull Secrets, as a list of strings.
  pullSecrets: []

server:
  repository: axis-server
  # Replicas share the data protection key ring in the platform database, so
  # sessions work on every replica. With Studio on, they also share the
  # studio.persistence volume, see docs/reference/installation.md.
  replicas: 1
  # A Kubernetes resources block: requests and limits.
  resources: {}
  service:
    type: ClusterIP
    # The port of the Service. It forwards to the HTTPS port of the server, 8443.
    port: 443

worker:
  repository: axis-worker
  replicas: 1
  resources: {}

# The publisher runs "axis-admin publisher", which runs the publish requests that
# Studio stores. It uses the image of migrate.repository and always runs one replica.
publisher:
  resources: {}
  # Longer than the five-minute lease, so a stop lets the running request finish.
  terminationGracePeriodSeconds: 360

# The Job that runs "axis-admin migrate" before every upgrade.
migrate:
  repository: axis-admin
  # The number of tenant databases migrated at once.
  parallel: 1
  resources: {}

tenancy:
  # How often the hosts reload the tenant directory, as a time span such as
  # "00:00:30". A value like "30s" stops the hosts at start.
  # Empty keeps the host default.
  refreshInterval: ""

# Setting cell.id makes the server, the worker and the publisher part of an Axis
# SaaS cell. They then need cell.region and cell.tenantDomain, and the id is the
# region, a hyphen and a number, such as "vn-1". Empty means a self-hosted
# installation and renders no Cell setting. Empty operatorRealm and
# operatorRole keep the host defaults.
cell:
  id: ""
  region: ""
  tenantDomain: ""
  internalDomain: ""
  tenantCap: ""
  consoleHost: ""
  consoleAllowedNetworks: []
  internalUrl: ""
  operatorRealm: ""
  operatorRole: ""
  backupKeyFile: ""
  # The wildcard certificate of the tenant subdomains, "*.<tenantDomain>", which
  # cert-manager gets and renews over ACME with the DNS-01 challenge. Turning it
  # on renders a cert-manager Issuer and Certificate, so cert-manager must be
  # installed in the cluster, and it needs tenantDomain, secretName and the
  # token Secret name. cert-manager writes the certificate into the TLS Secret
  # named by secretName, which the cell's ingress serves. The DNS provider's
  # token is a reference to an existing Secret and never a value. provider is
  # "cloudflare" or "digitalocean".
  certificate:
    enabled: false
    secretName: ""
    issuer:
      server: https://acme-v02.api.letsencrypt.org/directory
      email: ""
      dns01:
        provider: cloudflare
        tokenSecret:
          name: ""
          key: api-token
  # PgBouncer in transaction mode in front of PostgreSQL, so a cell's tenant databases fit within
  # PostgreSQL's connection limit. Turning it on renders a ConfigMap, a Deployment of one replica
  # and a Service named <release>-pgbouncer, and sends the runtime connections of the server and
  # the worker to it with Cell__RuntimeDatabaseHost and Cell__RuntimeDatabasePort (6432). It needs
  # cell.id, databaseHost, authUser, secrets.pgbouncerAuth and secrets.pgbouncerCertificate. The
  # publisher and the migrate Job keep connecting to PostgreSQL directly.
  pgbouncer:
    enabled: false
    # The whole image reference. The integration tests run the same image.
    image: edoburu/pgbouncer:v1.24.1-p1
    # Required. The host of PostgreSQL, and its port.
    databaseHost: ""
    databasePort: 5432
    # Required. The role that PgBouncer looks passwords up with, see docs/reference/installation.md.
    authUser: ""
    # The database that holds the lookup function pgbouncer.user_lookup of the auth user.
    authDatabase: postgres
    # The pool sizes of docs/reference/cells.md#connections.
    defaultPoolSize: 3
    maxDbConnections: 10
    maxClientConn: 10000
    # A Kubernetes resources block: requests and limits.
    resources: {}
    # Optional. A volume with root.crt, the authority certificate of the PostgreSQL server, mounted
    # read-only at /db-ca. Same form as identity.databaseAuthority.volume. Without it PgBouncer
    # verifies PostgreSQL's certificate against the system store.
    databaseAuthority:
      volume: {}

# Backups in a cell. It is used in a cell only. Setting bucket renders a CronJob that runs
# "axis-admin cell backup" every day at 01:00 in timeZone, an IANA time zone name such as
# "Asia/Ho_Chi_Minh". timeZone, serviceUrl and region are required with a bucket. The storage
# credentials are the two Secret references secrets.backupStorageAccessKeyId and
# secrets.backupStorageSecretAccessKey, and never values. The operator sets the bucket's object lock
# in compliance mode for 30 days and a lifecycle rule that deletes an archive after 30 days. The chart
# does not create or change the bucket. The schema rejects any other field.
backup:
  bucket: ""
  serviceUrl: ""
  region: ""
  timeZone: ""
  # A Kubernetes resources block: requests and limits.
  resources: {}

# Extension packages, mounted read-only at /extensions. Empty uses the empty
# folder of the image. Give any Kubernetes volume source, for example:
#   volume:
#     persistentVolumeClaim:
#       claimName: axis-extensions
extensions:
  volume: {}

# Modules, mounted read-only at /modules. Same form as extensions.volume.
modules:
  volume: {}

# Studio, on the server only. Setting folders turns Studio on. Each folder is a
# path relative to the Studio volume, which is mounted read-write at /studio on
# every server replica, so "purchase-requests" becomes /studio/purchase-requests.
# The roles are roles claim values. Without one, nobody may author or publish.
# persistence is required when folders is set. It is any Kubernetes volume source,
# and it needs a ReadWriteMany volume source when the server runs several
# replicas. The chart creates no claim. For example:
#   persistence:
#     persistentVolumeClaim:
#       claimName: axis-studio
# tests renders Studio__Tests on the server only, which shows the test controls to an author.
# Set it together with secrets.scenarioServerConnection, because the publisher cannot run a
# test request without that connection.
studio:
  folders: []
  authorRole: ""
  publisherRole: ""
  persistence: {}
  tests: false

# Axis's identity provider: one Keycloak pod, always on, with the Axis theme and the breached-password
# list. It listens on HTTPS only, with the certificate of secrets.identityCertificate. Its database
# settings and the axis-admin client secret come from the identity secrets below. Clustering Keycloak
# is not supported, so it always runs one replica. The chart renders no Ingress for it: yours sends the
# identity host to the Service <release>-identity.
identity:
  # The whole image reference of Keycloak. It is not the image.registry and image.tag of Axis's images.
  # Use the version that development, the tests and the Compose example pin.
  image: quay.io/keycloak/keycloak:26.8
  # Required. The one public host name of the identity provider, without a scheme, such as "id.example.com".
  hostname: ""
  resources: {}
  service:
    type: ClusterIP
    # The port of the Service. It forwards to the HTTPS port of Keycloak, 8443.
    port: 443
  # Required. The built Axis login theme, the output of `npm run build:keycloak-theme --prefix web`,
  # mounted read-only at /opt/keycloak/themes. Any Kubernetes volume source, for example:
  #   volume:
  #     persistentVolumeClaim:
  #       claimName: axis-keycloak-theme
  theme:
    volume: {}
  # Required. The breached-password list that every realm checks (deploy/keycloak/password-blacklists),
  # mounted read-only at /opt/keycloak/data/password-blacklists. Same form as theme.volume.
  passwordBlacklists:
    volume: {}
  # Optional. A volume with root.crt, the authority certificate of the PostgreSQL server, mounted
  # read-only at /db-ca. The JDBC URL in the identityDatabaseUrl Secret names it with
  # sslrootcert=/db-ca/root.crt. Same form as theme.volume. Not needed when the database
  # certificate is public and the URL uses sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory.
  databaseAuthority:
    volume: {}

# Forwarded headers, on the server and the identity provider. They read X-Forwarded-For,
# X-Forwarded-Proto and X-Forwarded-Host only from these addresses. Use IP
# addresses for knownProxies and CIDR ranges for knownNetworks. Empty trusts no
# proxy, and the identity provider then sets no proxy headers.
forwardedHeaders:
  knownProxies: []
  knownNetworks: []

# References to existing Kubernetes Secrets. The chart creates no Secret and
# never takes a secret value. Each reference holds the Secret's name and the
# key inside it. The schema rejects any other field.
secrets:
  # ConnectionStrings:Platform, the read-only platform database role.
  # Used by the server and the worker.
  platformConnection:
    name: ""
    key: ConnectionStrings__Platform
  # ConnectionStrings:PlatformSchema, the role that owns the platform schema.
  # Used by the server, the migrate Job and the publisher. The worker never gets it.
  platformSchemaConnection:
    name: ""
    key: ConnectionStrings__PlatformSchema
  # Platform:SecretKey, the installation key. Used by every host and the publisher.
  platformSecretKey:
    name: ""
    key: Platform__SecretKey
  # The server's HTTPS endpoint: a Kubernetes TLS Secret with tls.crt and tls.key, issued for the
  # DNS name of the server Service. Required, because the server listens on HTTPS only. The keys
  # are fixed, so the reference holds only the name. Your Ingress must connect over HTTPS and verify it.
  serverCertificate:
    name: ""
  # Scenarios:ServerConnectionString, the connection of a role with CREATEDB that owns no
  # database, which the publisher uses to run test scenarios. Optional, and used by the
  # publisher only. The Secret is mounted only when name is set. Set studio.tests with it.
  scenarioServerConnection:
    name: ""
    key: Scenarios__ServerConnectionString
  # KC_DB_URL, the JDBC URL of the identity provider's own database. Used by the identity provider only.
  identityDatabaseUrl:
    name: ""
    key: KC_DB_URL
  # KC_DB_USERNAME, the identity provider's database role. Used by the identity provider only.
  identityDatabaseUsername:
    name: ""
    key: KC_DB_USERNAME
  # KC_DB_PASSWORD, the password of that role. Used by the identity provider only.
  identityDatabasePassword:
    name: ""
    key: KC_DB_PASSWORD
  # IdentityProvider:AdminClientSecret, the secret of the axis-admin client, the bootstrap client of the
  # master realm. Used by the identity provider only, which reads it as KC_BOOTSTRAP_ADMIN_CLIENT_SECRET.
  identityAdminClientSecret:
    name: ""
    key: IdentityProvider__AdminClientSecret
  # The identity provider's HTTPS endpoint: a Kubernetes TLS Secret with tls.crt and tls.key, issued for
  # the DNS name of the identity Service. Required. Your Ingress must connect over HTTPS and verify it.
  identityCertificate:
    name: ""
  # The auth user's line of PgBouncer's userlist.txt, and only that line, so PgBouncer can run the
  # lookup query. Used by PgBouncer only, and required when cell.pgbouncer.enabled is true.
  pgbouncerAuth:
    name: ""
    key: userlist.txt
  # PgBouncer's TLS endpoint for the server and the worker: a Kubernetes TLS Secret with tls.crt and
  # tls.key, issued for the DNS name of the PgBouncer Service. Required when cell.pgbouncer.enabled
  # is true. The keys are fixed, so the reference holds only the name.
  pgbouncerCertificate:
    name: ""
  # Cell:BackupStorage:AccessKeyId, the access key id of the backup storage. Used by the cell backup
  # CronJob only. Needed with backup.bucket.
  backupStorageAccessKeyId:
    name: ""
    key: Cell__BackupStorage__AccessKeyId
  # Cell:BackupStorage:SecretAccessKey, the secret access key of the backup storage. Used by the cell
  # backup CronJob only. Needed with backup.bucket.
  backupStorageSecretAccessKey:
    name: ""
    key: Cell__BackupStorage__SecretAccessKey
  # The cell's backup key, which unwraps the keys of the tenants. Used by the cell backup CronJob
  # only, which mounts it read-only at /cell-backup-key/key and points Cell:BackupKeyFile there.
  # Needed with backup.bucket.
  cellBackupKey:
    name: ""
    key: cell-backup-key
