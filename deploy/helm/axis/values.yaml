# Values of the Axis chart. See docs/reference/installation.md.
# PostgreSQL, the OIDC provider and the source of secrets are external.

image:
  # Registry prefix of the three images, such as "registry.example.com/axis".
  # Empty uses the repository names as they are.
  registry: ""
  # The tag of all three images. Empty uses the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  # Names of image pull Secrets, as a list of strings.
  pullSecrets: []

server:
  repository: axis-server
  # Replicas share the data protection key ring in the platform database, so
  # sessions work on every replica. With Studio on, they also share the
  # studio.persistence volume, see docs/reference/installation.md.
  replicas: 1
  # A Kubernetes resources block: requests and limits.
  resources: {}
  service:
    type: ClusterIP
    port: 80

worker:
  repository: axis-worker
  replicas: 1
  resources: {}

# The publisher runs "axis-admin publisher", which runs the publish requests that
# Studio stores. It uses the image of migrate.repository and always runs one replica.
publisher:
  resources: {}
  # Longer than the five-minute lease, so a stop lets the running request finish.
  terminationGracePeriodSeconds: 360

# The Job that runs "axis-admin migrate" before every upgrade.
migrate:
  repository: axis-admin
  # The number of tenant databases migrated at once.
  parallel: 1
  resources: {}

tenancy:
  # How often the hosts reload the tenant directory, as a time span such as
  # "00:00:30". A value like "30s" stops the hosts at start.
  # Empty keeps the host default.
  refreshInterval: ""

# Extension packages, mounted read-only at /extensions. Empty uses the empty
# folder of the image. Give any Kubernetes volume source, for example:
#   volume:
#     persistentVolumeClaim:
#       claimName: axis-extensions
extensions:
  volume: {}

# Modules, mounted read-only at /modules. Same form as extensions.volume.
modules:
  volume: {}

# Studio, on the server only. Setting folders turns Studio on. Each folder is a
# path relative to the Studio volume, which is mounted read-write at /studio on
# every server replica, so "purchase-requests" becomes /studio/purchase-requests.
# The roles are roles claim values. Without one, nobody may author or publish.
# persistence is required when folders is set. It is any Kubernetes volume source,
# and it needs a ReadWriteMany volume source when the server runs several
# replicas. The chart creates no claim. For example:
#   persistence:
#     persistentVolumeClaim:
#       claimName: axis-studio
# tests renders Studio__Tests on the server only, which shows the test controls to an author.
# Set it together with secrets.scenarioServerConnection, because the publisher cannot run a
# test request without that connection.
studio:
  folders: []
  authorRole: ""
  publisherRole: ""
  persistence: {}
  tests: false

# Forwarded headers, on the server only. The server reads X-Forwarded-For,
# X-Forwarded-Proto and X-Forwarded-Host only from these addresses. Use IP
# addresses for knownProxies and CIDR ranges for knownNetworks. Empty trusts no
# proxy.
forwardedHeaders:
  knownProxies: []
  knownNetworks: []

# References to existing Kubernetes Secrets. The chart creates no Secret and
# never takes a secret value. Each reference holds the Secret's name and the
# key inside it. The schema rejects any other field.
secrets:
  # ConnectionStrings:Platform, the read-only platform database role.
  # Used by the server and the worker.
  platformConnection:
    name: ""
    key: ConnectionStrings__Platform
  # ConnectionStrings:PlatformSchema, the role that owns the platform schema.
  # Used by the server, the migrate Job and the publisher. The worker never gets it.
  platformSchemaConnection:
    name: ""
    key: ConnectionStrings__PlatformSchema
  # Platform:SecretKey, the installation key. Used by every host and the publisher.
  platformSecretKey:
    name: ""
    key: Platform__SecretKey
  # Scenarios:ServerConnectionString, the connection of a role with CREATEDB that owns no
  # database, which the publisher uses to run test scenarios. Optional, and used by the
  # publisher only. The Secret is mounted only when name is set. Set studio.tests with it.
  scenarioServerConnection:
    name: ""
    key: Scenarios__ServerConnectionString
