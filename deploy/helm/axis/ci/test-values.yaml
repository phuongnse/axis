# Values for the lint, the schema check and the render tests. They name every
# Secret, the server and identity certificates, the identity host and every volume, run two server replicas, turn Studio and its test controls on, name the
# scenario connection Secret and name one proxy and one network, so the checks cover every branch of the templates.
server:
  replicas: 2
studio:
  folders:
    - purchase-requests
  authorRole: author
  publisherRole: publisher
  tests: true
  persistence:
    persistentVolumeClaim:
      claimName: axis-studio
forwardedHeaders:
  knownProxies:
    - 10.0.0.10
  knownNetworks:
    - 10.0.0.0/8
identity:
  hostname: id.example.com
  theme:
    volume:
      persistentVolumeClaim:
        claimName: axis-keycloak-theme
  passwordBlacklists:
    volume:
      configMap:
        name: axis-password-blacklists
  databaseAuthority:
    volume:
      configMap:
        name: axis-db-ca
secrets:
  platformConnection:
    name: axis-platform
  platformSchemaConnection:
    name: axis-platform
  platformSecretKey:
    name: axis-platform
  serverCertificate:
    name: axis-server-tls
  scenarioServerConnection:
    name: axis-scenario
  identityDatabaseUrl:
    name: axis-identity
  identityDatabaseUsername:
    name: axis-identity
  identityDatabasePassword:
    name: axis-identity
  identityAdminClientSecret:
    name: axis-identity
  identityCertificate:
    name: axis-identity-tls
extensions:
  volume:
    persistentVolumeClaim:
      claimName: axis-extensions
modules:
  volume:
    persistentVolumeClaim:
      claimName: axis-modules
