# Values for the lint, the schema check and the render tests. They name every
# Secret, the server certificate and both volumes, run two server replicas, turn Studio and its test controls on, name the
# scenario connection Secret and name one proxy and one network, so the checks cover every branch of the templates.
server:
  replicas: 2
studio:
  folders:
    - purchase-requests
  authorRole: author
  publisherRole: publisher
  tests: true
  persistence:
    persistentVolumeClaim:
      claimName: axis-studio
forwardedHeaders:
  knownProxies:
    - 10.0.0.10
  knownNetworks:
    - 10.0.0.0/8
secrets:
  platformConnection:
    name: axis-platform
  platformSchemaConnection:
    name: axis-platform
  platformSecretKey:
    name: axis-platform
  serverCertificate:
    name: axis-server-tls
  scenarioServerConnection:
    name: axis-scenario
extensions:
  volume:
    persistentVolumeClaim:
      claimName: axis-extensions
modules:
  volume:
    persistentVolumeClaim:
      claimName: axis-modules
