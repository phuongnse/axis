# Values for the lint, the schema check and the render tests. They set the region and the tenant domain, set the mail sender, relay and user name, name the
# connection string, mail password, challenge key and certificate Secrets, list two cells with the client certificate and the authority, run two replicas and set resources and one image pull Secret, so the
# checks cover every branch of the templates.
image:
  pullSecrets:
    - registry-credentials
replicas: 2
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
controlPlane:
  region: vn
  tenantDomain: vn.example.com
  mailFrom: no-reply@mail.vn.example.com
  mail:
    host: smtp.example.com
    userName: relay-user
  cells:
    - id: vn-1
      internalUrl: https://cell.vn-1.internal.example.com
      tokenUrl: https://cell.vn-1.internal.example.com/realms/operator/protocol/openid-connect/token
      clientId: axis-controlplane
      clientSecret:
        name: axis-cell-vn-1
    - id: vn-2
      internalUrl: https://cell.vn-2.internal.example.com
      tokenUrl: https://cell.vn-2.internal.example.com/realms/operator/protocol/openid-connect/token
      clientId: axis-controlplane
      clientSecret:
        name: axis-cell-vn-2
        key: secret
secrets:
  connectionString:
    name: axis-controlplane-db
  mailPassword:
    name: axis-controlplane-mail
  challengeKey:
    name: axis-controlplane-sign-up
  certificate:
    name: axis-controlplane-tls
  cellClientCertificate:
    name: axis-controlplane-cell-client
  cellCertificateAuthority:
    name: axis-region-ca
