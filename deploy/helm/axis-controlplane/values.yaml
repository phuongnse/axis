# Values of the Axis control plane chart. See docs/reference/control-plane.md.
# PostgreSQL and the source of secrets are external.

image:
  # Registry prefix of the image, such as "registry.example.com/axis".
  # Empty uses the repository name as it is.
  registry: ""
  repository: axis-controlplane
  # The tag of the image. Empty uses the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  # Names of image pull Secrets, as a list of strings.
  pullSecrets: []

replicas: 1
# A Kubernetes resources block: requests and limits.
resources: {}

service:
  type: ClusterIP
  # The port of the Service. It forwards to the HTTPS port of the control plane, 8443.
  port: 443

controlPlane:
  # ControlPlane:Region, the region code, such as "vn": lowercase letters and digits only. Required.
  region: ""
  # ControlPlane:TenantDomain, the domain of the tenant subdomains of the region, such as "vn.example.com". Required.
  tenantDomain: ""
  # ControlPlane:MailFrom, the address every email of the control plane comes from, such as "no-reply@mail.example.com".
  # Required. Its domain needs SPF, DKIM and DMARC at the relay.
  mailFrom: ""
  # ControlPlane:Mail, the SMTP relay of the control plane's own emails, never a cell's mail settings.
  mail:
    # ControlPlane:Mail:Host. Required.
    host: ""
    port: 587
    # TLS is on. Port 465 starts with TLS, any other port upgrades with STARTTLS.
    useTls: true
    # ControlPlane:Mail:UserName. Optional. When set, secrets.mailPassword is required.
    userName: ""
  # ControlPlane:PayOs, the PayOS adapter that creates the payment links of the VND invoices. Optional.
  payOs:
    # ControlPlane:PayOs:Provider. Empty registers no PayOS adapter and no payment link job. "PayOs" calls the real PayOS,
    # and then secrets.payOs is required. The chart runs in Production, so it does not offer "Fake".
    provider: ""
    # ControlPlane:PayOs:BaseUrl, the https address of the PayOS API. Used only with the provider "PayOs".
    baseUrl: https://api-merchant.payos.vn

secrets:
  # ControlPlane:ConnectionString, the connection string of the control plane database. It must set
  # SSL Mode=VerifyFull. Required. The chart mounts it as the file /run/secrets/ControlPlane__ConnectionString.
  connectionString:
    name: ""
    key: ControlPlane__ConnectionString
  # The control plane's HTTPS endpoint: a Kubernetes TLS Secret with tls.crt and tls.key, issued for the
  # DNS name of the Service. Required, because the control plane listens on HTTPS only. The keys
  # are fixed, so the reference holds only the name.
  certificate:
    name: ""
  # ControlPlane:Mail:Password, the password of controlPlane.mail.userName. The chart mounts it as the file
  # /run/secrets/ControlPlane__Mail__Password. Leave the name empty when the relay needs no sign-in.
  mailPassword:
    name: ""
    key: ControlPlane__Mail__Password
  # ControlPlane:SignUp:ChallengeKey, the base64 HMAC-SHA256 key (at least 32 bytes) that signs the sign-up page's proof-of-work
  # challenges. The chart mounts it as the file /run/secrets/ControlPlane__SignUp__ChallengeKey. Optional: leave the name empty and
  # GET /api/sign-up/challenge and POST /api/sign-up answer 503.
  challengeKey:
    name: ""
    key: ControlPlane__SignUp__ChallengeKey
  # The PayOS keys, a Kubernetes Secret with the keys ControlPlane__PayOs__ClientId, ControlPlane__PayOs__ApiKey and
  # ControlPlane__PayOs__ChecksumKey. The chart mounts each as the file of the same name in /run/secrets. The keys are fixed,
  # so the reference holds only the name. Required when controlPlane.payOs.provider is "PayOs", and left out otherwise.
  payOs:
    name: ""
