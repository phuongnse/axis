model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[mcp_servers.axis]
command = "python"
args = ["scripts/axis.py", "mcp", "serve"]
startup_timeout_sec = 120
