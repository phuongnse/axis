# Runs the whole Axis stack from source: PostgreSQL, Keycloak with the development realm at
# http://localhost:8080, the server with the purchase request and leave request samples, at http://localhost:5206,
# the worker, the publisher and the purchasing system stub at http://localhost:5207. Sign-in is not wired here
# yet: the server in its container cannot reach Keycloak at the address the browser uses. For
# development, scripts/dev.sh starts only PostgreSQL, Keycloak, Mailpit and the purchasing system stub from
# here and runs the server, the worker, the publisher and the SPA with hot reload.
# The development settings are in src/Axis.Server/appsettings.Development.json.
# Mailpit, a local mail server, keeps every email the worker sends. Its web page is at http://localhost:8025.
# All six ports are published on 127.0.0.1 only. AXIS_SERVER_PORT (default 5206),
# AXIS_POSTGRES_PORT (default 5432), AXIS_KEYCLOAK_PORT (default 8080), AXIS_PURCHASING_PORT
# (default 5207), AXIS_MAILPIT_SMTP_PORT (default 1025) and AXIS_MAILPIT_WEB_PORT (default 8025)
# change the host ports.
# PostgreSQL loads samples/postgres/init-roles.sql on its first start. It creates the two database
# roles: the server runs startup activation as axis_schema and serves requests as axis_runtime, the
# worker runs only as axis_runtime, and the publisher runs its steps as axis_schema. axis stays the
# bootstrap superuser. A third role, axis_scenario, has CREATEDB and owns no database. Only the publisher
# gets it, to run test scenarios. It also creates the preview tenant's database axis_preview and its two roles,
# axis_preview_schema and axis_preview_runtime, which the server and the worker use the same way for
# the tenant default-preview. The server serves that tenant at http://preview.localhost:5206 and
# activates both samples on it. It has no deployment bindings. The publisher serves both tenants, so it
# runs preview requests. PostgreSQL runs the file only on an empty volume, so a volume from before the roles or
# before the preview database needs `docker compose down -v` once. That deletes its data.
# The server creates Studio's new applications in ./artifacts/studio-apps, mounted at /studio-apps.
# AXIS_STUDIO_APPS_DIR moves that folder. On Linux the server runs as UID 1654, so the folder must be writable by
# that UID. Docker creates a missing folder as root, so create it first.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: axis
      POSTGRES_PASSWORD: axis
      POSTGRES_DB: axis
    ports:
      - "127.0.0.1:${AXIS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - axis-postgres:/var/lib/postgresql
      - ./samples/postgres/init-roles.sql:/docker-entrypoint-initdb.d/init-roles.sql:ro
    # Check over TCP: the image's initialization server listens only on the Unix socket.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "axis", "-d", "axis"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Imports the axis realm from samples/keycloak on start. The admin console login is admin / admin. It also holds the
  # breached-password list that realms made by `tenant create` check passwords against. The realm signs people in on
  # the Axis theme, which is mounted from artifacts/keycloak-theme. Build it first with
  # `npm run build:keycloak-theme --prefix web`, or Docker creates the folder owned by root and the build fails.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./samples/keycloak:/opt/keycloak/data/import:ro
      - ./deploy/keycloak/password-blacklists:/opt/keycloak/data/password-blacklists:ro
      - ./artifacts/keycloak-theme:/opt/keycloak/themes:ro
    ports:
      - "127.0.0.1:${AXIS_KEYCLOAK_PORT:-8080}:8080"
    # Healthy once the realm answers. The image has bash but no curl.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/axis/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Platform: Host=postgres;Port=5432;Database=axis;Username=axis_runtime;Password=axis
      # Only the server gets this setting. The development key Platform:SecretKey is in appsettings.Development.json.
      ConnectionStrings__PlatformSchema: Host=postgres;Port=5432;Database=axis;Username=axis_schema;Password=axis
      Tenants__default__ConnectionString: Host=postgres;Port=5432;Database=axis;Username=axis_runtime;Password=axis
      # Only the server reads this setting. Startup activation uses it.
      Tenants__default__SchemaConnectionString: Host=postgres;Port=5432;Database=axis;Username=axis_schema;Password=axis
      # The preview tenant default-preview. Its other settings are in appsettings.Development.json.
      Tenants__default-preview__ConnectionString: Host=postgres;Port=5432;Database=axis_preview;Username=axis_preview_runtime;Password=axis
      Tenants__default-preview__SchemaConnectionString: Host=postgres;Port=5432;Database=axis_preview;Username=axis_preview_schema;Password=axis
      # Blank, so startup activation skips the realm update: the container cannot reach Keycloak at localhost:8080.
      Tenants__default__Realm__ActivationClientSecret: ""
      ActivateOnStartup__0: /samples/apps/purchase-requests
      ActivateOnStartup__1: /samples/apps/leave-requests
      ActivateOnStartup__2: /samples/apps/service-desk
      ActivateOnStartup__3: /samples/apps/asset-management
      # The sample extension package payment-references, which the image holds, that the sample declares.
      Extensions__Path: /extensions
      # The sample module departments, which the image holds.
      Modules__Path: /modules
      # The sample templates, which the image holds.
      Templates__Path: /templates
      # The purchasing system stub on the Compose network. The client id and secret and the webhook secret are in appsettings.Development.json.
      Tenants__default__Bindings__PurchasingSystemUrl__Value: http://purchasing:8080
      Tenants__default__Bindings__PurchasingSystemTokenUrl__Value: http://purchasing:8080/oauth/token
      Tenants__default__Bindings__PurchaseRequestApprovedWebhookUrl__Value: http://purchasing:8080/webhooks/purchase-request-approved
      # The folder where Studio creates new applications. The volume below mounts it from the checkout.
      Studio__ApplicationsPath: /studio-apps
    volumes:
      - ${AXIS_STUDIO_APPS_DIR:-./artifacts/studio-apps}:/studio-apps
    ports:
      - "127.0.0.1:${AXIS_SERVER_PORT:-5206}:8080"
    # Healthy only once activation has finished and the server answers. A slow runner needs up to 5 minutes for it.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 2s

  # Waits until the server has migrated the tenant database, then runs its due work items. It
  # calls the purchasing system stub when a purchase request is approved, and runs the sample
  # extension package that assigns the payment reference.
  worker:
    build:
      context: .
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      purchasing:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Development
      # The sample extension package payment-references, which the image holds.
      Extensions__Path: /extensions
      # The sample module departments, which the image holds.
      Modules__Path: /modules
      # The worker sends its emails to Mailpit. Development is the only environment that sends without TLS.
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Email__Smtp__UseTls: "false"
      Email__From: axis@localhost
      Tenants__default__ConnectionString: Host=postgres;Port=5432;Database=axis;Username=axis_runtime;Password=axis
      Tenants__default-preview__ConnectionString: Host=postgres;Port=5432;Database=axis_preview;Username=axis_preview_runtime;Password=axis
      Tenants__default__Bindings__PurchasingSystemUrl__Value: http://purchasing:8080
      Tenants__default__Bindings__PurchasingSystemTokenUrl__Value: http://purchasing:8080/oauth/token
      Tenants__default__Bindings__PurchaseRequestApprovedWebhookUrl__Value: http://purchasing:8080/webhooks/purchase-request-approved
    # Healthy once the tenant database is migrated and the loop polls. The health address
    # http://127.0.0.1:5208 stays inside the container, so no port is published. The image has
    # bash but no curl. The worker is ready only after the server has activated.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5208 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 360s
      start_interval: 2s

  # Runs the publish requests of Studio for the tenant. It waits until the server has migrated the tenant
  # database, then writes `default ready`. The development target holds the sample extension package and
  # module that the purchase request sample declares. The tenant settings are repeated here because the
  # admin host reads no appsettings file. The token is in appsettings.Development.json of the server.
  publisher:
    build:
      context: .
      target: publisher
    command: ["publisher"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Development
      Extensions__Path: /extensions
      Modules__Path: /modules
      Tenants__default__Hosts__0: localhost
      # The development tenant keys, as in appsettings.Development.json of the server.
      Tenants__default__DataKeys__1: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      Tenants__default__LookupKeys__1: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
      Tenants__default__ConnectionString: Host=postgres;Port=5432;Database=axis;Username=axis_runtime;Password=axis
      Tenants__default__SchemaConnectionString: Host=postgres;Port=5432;Database=axis;Username=axis_schema;Password=axis
      Tenants__default__Bindings__PurchasingSystemUrl__Kind: url
      Tenants__default__Bindings__PurchasingSystemUrl__Value: http://purchasing:8080
      Tenants__default__Bindings__PurchasingSystemTokenUrl__Kind: url
      Tenants__default__Bindings__PurchasingSystemTokenUrl__Value: http://purchasing:8080/oauth/token
      Tenants__default__Bindings__PurchasingSystemClientId__Kind: secret
      Tenants__default__Bindings__PurchasingSystemClientId__Value: axis-purchasing
      Tenants__default__Bindings__PurchasingSystemClientSecret__Kind: secret
      Tenants__default__Bindings__PurchasingSystemClientSecret__Value: axis-development-purchasing-secret
      Tenants__default__Bindings__PurchaseRequestApprovedWebhookUrl__Kind: url
      Tenants__default__Bindings__PurchaseRequestApprovedWebhookUrl__Value: http://purchasing:8080/webhooks/purchase-request-approved
      Tenants__default__Bindings__PurchaseRequestApprovedWebhookSecret__Kind: secret
      Tenants__default__Bindings__PurchaseRequestApprovedWebhookSecret__Value: whsec_YXhpcy1kZXZlbG9wbWVudC13ZWJob29rLXNlY3JldA==
      # The company realm's broker client, as in appsettings.Development.json of the server.
      Tenants__default__Bindings__CompanyIssuer__Kind: url
      Tenants__default__Bindings__CompanyIssuer__Value: http://localhost:8080/realms/company
      Tenants__default__Bindings__CompanyClientId__Kind: secret
      Tenants__default__Bindings__CompanyClientId__Value: axis-broker
      Tenants__default__Bindings__CompanyClientSecret__Kind: secret
      Tenants__default__Bindings__CompanyClientSecret__Value: axis-broker-development-secret
      # The preview tenant default-preview, where preview requests run.
      Tenants__default-preview__PreviewOf: default
      Tenants__default-preview__Hosts__0: preview.localhost
      Tenants__default-preview__DataKeys__1: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
      Tenants__default-preview__LookupKeys__1: BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ=
      Tenants__default-preview__ConnectionString: Host=postgres;Port=5432;Database=axis_preview;Username=axis_preview_runtime;Password=axis
      Tenants__default-preview__SchemaConnectionString: Host=postgres;Port=5432;Database=axis_preview;Username=axis_preview_schema;Password=axis
      # The role that creates the databases of test scenarios. Only the publisher gets it, and it connects to
      # the postgres maintenance database because the role owns no database of its own.
      Scenarios__ServerConnectionString: Host=postgres;Port=5432;Database=postgres;Username=axis_scenario;Password=axis

  # The purchasing system stub from tests/Axis.PurchasingStub. It keeps its orders in memory.
  purchasing:
    build:
      context: .
      target: purchasing
    ports:
      - "127.0.0.1:${AXIS_PURCHASING_PORT:-5207}:8080"
    # The image has bash but no curl.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Mailpit keeps every email and shows them on its web page. It is the same image as the integration tests use.
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${AXIS_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${AXIS_MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  axis-postgres:
