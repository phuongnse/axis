# Runs the whole Axis stack from source: PostgreSQL and the server with the purchase request
# sample, at http://localhost:5206. For development, scripts/dev.sh starts only PostgreSQL from
# here and runs the server and the SPA with hot reload. The development settings are in
# src/Axis.Server/appsettings.Development.json.
# Both ports are published on 127.0.0.1 only. AXIS_SERVER_PORT (default 5206) and
# AXIS_POSTGRES_PORT (default 5432) change the host ports.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: axis
      POSTGRES_PASSWORD: axis
      POSTGRES_DB: axis
    ports:
      - "127.0.0.1:${AXIS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - axis-postgres:/var/lib/postgresql
    # Check over TCP: the image's initialization server listens only on the Unix socket.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "axis", "-d", "axis"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Platform: Host=postgres;Port=5432;Database=axis;Username=axis;Password=axis
      Tenants__default__ConnectionString: Host=postgres;Port=5432;Database=axis;Username=axis;Password=axis
      ActivateOnStartup__0: /samples/apps/purchase-requests
    ports:
      - "127.0.0.1:${AXIS_SERVER_PORT:-5206}:8080"
    # Healthy only once activation has finished and the server answers.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

volumes:
  axis-postgres:
