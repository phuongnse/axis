version = 1

[semantic_roles]
independent-reviewer = "axis_reviewer"

[workflows.review]
initial = "checkpoint"
terminal_states = ["review-approved", "published"]
states = ["checkpoint", "readiness-verified", "review-approved", "changes-requested", "published"]

[[workflows.review.transitions]]
id = "verify-readiness"
from = "checkpoint"
to = "readiness-verified"
owner = "skill:axis-review-readiness"
evidence = "command:review-readiness"

[[workflows.review.transitions]]
id = "approve-review"
from = "readiness-verified"
to = "review-approved"
owner = "role:independent-reviewer"
evidence = "completed-review-pass"

[[workflows.review.transitions]]
id = "request-changes"
from = "readiness-verified"
to = "changes-requested"
owner = "role:independent-reviewer"
evidence = "completed-review-findings"

[[workflows.review.transitions]]
id = "resolve-findings"
from = "changes-requested"
to = "checkpoint"
owner = "skill:axis-review-feedback"
evidence = "immutable-follow-up-checkpoint"

[[workflows.review.transitions]]
id = "publish"
from = "review-approved"
to = "published"
owner = "skill:axis-pull-request"
evidence = "validated-remote-state"

[workflows.ui-design]
initial = "requested"
terminal_states = ["enforced"]
states = ["requested", "authorized", "defined", "verified", "enforced"]

[[workflows.ui-design.transitions]]
id = "authorize-ui-design"
from = "requested"
to = "authorized"
owner = "skill:axis-design-gate"
evidence = "current-design-dossier-and-required-sign-off"

[[workflows.ui-design.transitions]]
id = "define-ui-system"
from = "authorized"
to = "defined"
owner = "skill:axis-ui-system"
evidence = "current-contract-spec-and-compiler-bound-owner-symbol"

[[workflows.ui-design.transitions]]
id = "verify-ui-contract"
from = "defined"
to = "verified"
owner = "skill:axis-ui-system"
evidence = "component-browser-accessibility-and-visual-contract-evidence"

[[workflows.ui-design.transitions]]
id = "enforce-ui-contract"
from = "verified"
to = "enforced"
owner = "skill:axis-ui-system"
evidence = "typed-active-consumers-rendered-owner-evidence-and-passing-conformance-policy"

[[workflows.ui-design.transitions]]
id = "revise-enforced-ui-contract"
from = "enforced"
to = "authorized"
owner = "skill:axis-ui-system"
evidence = "approved-contract-revision-and-clean-cutover-plan"
