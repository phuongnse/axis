<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <script>
      (() => {
        if (window.location.pathname !== '/invitations/accept') return;

        const rawFragment = window.location.hash;
        window.history.replaceState(null, '', `${window.location.pathname}${window.location.search}`);
        let token = null;
        try {
          token = rawFragment.startsWith('#token=')
            ? decodeURIComponent(rawFragment.slice('#token='.length))
            : null;
        } catch {
          token = null;
        }
        if (!token) return;

        window.__axisInvitationBootstrap = (async () => {
          try {
            const sessionResponse = await fetch('/api/auth/session', {
              credentials: 'include',
              headers: { Accept: 'application/json' },
              referrerPolicy: 'no-referrer',
            });
            if (!sessionResponse.ok) return { status: 'failed' };
            const session = await sessionResponse.json();
            if (typeof session.csrfToken !== 'string') return { status: 'failed' };

            const exchangeResponse = await fetch('/api/internal/workspace-invitations/exchange', {
              method: 'POST',
              credentials: 'include',
              headers: {
                Accept: 'application/json',
                'Content-Type': 'application/json',
                'X-CSRF-TOKEN': session.csrfToken,
              },
              body: JSON.stringify({ token }),
              referrerPolicy: 'no-referrer',
            });
            return { status: exchangeResponse.ok ? 'exchanged' : 'failed' };
          } catch {
            return { status: 'failed' };
          }
        })();
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axis Platform</title>
    <script>
      // Sync with THEME_STORAGE_KEY and LANGUAGE_STORAGE_KEY in frontend stores.
      (() => {
        const supportedLanguages = new Set(['en', 'vi']);
        const supportedThemeModes = new Set(['light', 'dark', 'system']);
        let themeMode = 'system';
        let prefersDark = false;

        const normalizeThemeMode = (value) =>
          supportedThemeModes.has(value) ? value : 'system';

        try {
          themeMode = normalizeThemeMode(localStorage.getItem('axis.theme'));
        } catch {
          themeMode = 'system';
        }

        try {
          prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        } catch {
          prefersDark = false;
        }

        try {
          const resolvedTheme = themeMode === 'dark' || (themeMode === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', resolvedTheme);
          document.documentElement.dataset.themeMode = themeMode;
          document.documentElement.style.colorScheme = resolvedTheme ? 'dark' : 'light';
        } catch {
          document.documentElement.dataset.themeMode = 'system';
          document.documentElement.style.colorScheme = 'light';
        }

        const readStoredLanguage = () => {
          try {
            return localStorage.getItem('axis.language');
          } catch {
            return null;
          }
        };

        const normalizeLanguage = (value) => {
          if (!value) return null;
          const base = String(value).toLowerCase().split('-')[0];
          return supportedLanguages.has(base) ? base : null;
        };

        const browserLanguages =
          navigator.languages?.length
            ? navigator.languages
            : [navigator.language];

        const languageCandidates = [readStoredLanguage(), ...browserLanguages];
        const resolvedLanguage = languageCandidates.map(normalizeLanguage).find(Boolean) || 'en';

        try {
          document.documentElement.lang = resolvedLanguage;
        } catch {
          document.documentElement.lang = 'en';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
