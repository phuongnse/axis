name: CI

# A push to any branch runs CI, so hand-made pull requests show its result. NexKit's
# branches are left out: NexKit runs the same scripts as its own checks, and its pushes and
# pull requests use the Actions token, which starts no workflow or waits for approval.
on:
  push:
    branches-ignore: ['nexkit/**']
  # NexKit starts CI on main after it merges, because its merge starts no push workflow.
  workflow_dispatch:

permissions:
  contents: read

# A newer push stops an older run on any branch but main. On main a run always finishes, so every
# merge gets a result: a newer merge only replaces a run that is still waiting to start.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The checks run as six parallel jobs, so the run takes as long as its slowest job, not all of them.
  # Playwright is split into three shards, each a job of its own. Each shard's step runs the command of
  # NexKit's check for that shard, such as AXIS_E2E_SHARD=2/3 scripts/e2e.sh, so NexKit matches a pull
  # request's failing e2e-2 check with a failed shard 2/3 here.
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            name: Lint and unit tests
            artifact: test-results-unit
          - suite: integration
            name: Integration tests
            artifact: test-results-integration
          - suite: smoke
            name: Smoke tests
            artifact: test-results-smoke
          - suite: e2e
            name: End-to-end tests 1/3
            shard: 1/3
            artifact: test-results-e2e-1
          - suite: e2e
            name: End-to-end tests 2/3
            shard: 2/3
            artifact: test-results-e2e-2
          - suite: e2e
            name: End-to-end tests 3/3
            shard: 3/3
            artifact: test-results-e2e-3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner image has .NET SDKs, and NexKit's checks use them as they are. When one matches
      # global.json, CI uses it too, so an outage of the SDK download cannot fail the run.
      - name: Find a .NET SDK that matches global.json
        id: sdk
        run: |
          if dotnet --version; then
            echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(command -v dotnet)")")" >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      # Without one, CI downloads the SDK. The download fails at times, so a failed install is
      # tried once more after a pause.
      - id: dotnet
        if: steps.sdk.outputs.found != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        continue-on-error: true
        with:
          global-json-file: global.json
      - if: steps.dotnet.outcome == 'failure'
        run: sleep 60
      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # NexKit restores these caches before its setup but never saves them; CI on main does.
      # Each step must match its `cache` entry in .nexkit/config.json: the same paths and
      # key files, in the same order, and before Setup so the key files are as committed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nexkit-${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nexkit-${{ runner.os }}-nuget-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: nexkit-${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json', 'tests/e2e/package-lock.json') }}
          restore-keys: nexkit-${{ runner.os }}-npm-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: nexkit-${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: nexkit-${{ runner.os }}-playwright-
      - name: Setup
        run: scripts/setup.sh
      - name: Build
        id: build
        run: scripts/build.sh
      # Every check of the job runs once the build succeeds, so one run shows all results.
      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.suite == 'unit' }}
        run: scripts/lint.sh
      - name: Unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.suite == 'unit' }}
        run: scripts/test.sh
      - name: Integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.suite == 'integration' }}
        run: scripts/integration.sh
      - name: Smoke tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.suite == 'smoke' }}
        run: scripts/smoke.sh
      - name: End-to-end tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.suite == 'e2e' }}
        run: AXIS_E2E_SHARD=${{ matrix.shard }} scripts/e2e.sh
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            artifacts
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  # NexKit autopilot looks at this run as soon as it ends: a run that NexKit started with
  # the Actions token sends no workflow_run event, but it may dispatch NexKit's sweep.
  nexkit-sweep:
    needs: [checks]
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      # GitHub's API rejects a dispatch at times with a server error, so a failed dispatch is
      # tried again after a pause. The job fails only when every try fails.
      - run: |
          for attempt in 1 2 3; do
            if gh workflow run nexkit.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f command=autopilot -f number=autopilot -f note="after run $GITHUB_RUN_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
