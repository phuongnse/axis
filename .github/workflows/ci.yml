name: CI

# CI runs on main alone (D146). NexKit checks every branch with the same scripts: its own pull
# requests in each round, and a person's at /nexkit review, so a push to a branch starts no CI. A
# pull request that changes this file runs it, so the change is tried before it merges. On main,
# NexKit starts CI every few merges, by merge.after_workflows, rather than a push starting it after
# each one. It also runs on demand. Once a week the schedule runs the dependency and image scans
# alone, so a new advisory fails CI on main even when nothing merged (D107).
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ci.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

# A newer run stops an older one on any ref but main. On main a run always finishes: a newer
# run only replaces one that is still waiting to start.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Reads the checks of .nexkit/config.json and lists one matrix entry per check, or per group of
  # checks, with its commands, timeout and result folders. A sharded check becomes its shards, as
  # NexKit's shards job makes them: its count command runs, and the last line it prints, a whole
  # number N from 1 to its max, gives the checks <name>-1 to <name>-N, each with NEXKIT_SHARD=k/N. A
  # count that fails or prints anything else fails this job, since nothing guesses a number. The
  # matrix is built here, in a protected path, so a script an agent may change decides only how many
  # shards run, never more than the max (docs/development.md#shards).
  matrix:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: read
        run: |
          counts='{}'
          while IFS=$'\t' read -r name max command; do
            echo "::group::count the shards of $name: $command"
            output=$(timeout 5m bash -c "$command" </dev/null) || { echo "::error::$name: \`$command\` failed"; exit 1; }
            echo "$output"
            echo "::endgroup::"
            number=$({ grep -v '^[[:space:]]*$' <<<"$output" || true; } | tail -n 1 | tr -d '[:space:]')
            if ! [[ "$number" =~ ^[0-9]+$ ]] || [ "$number" -lt 1 ] || [ "$number" -gt "$max" ]; then
              echo "::error::$name: \`$command\` printed '$number' last, not a whole number from 1 to $max"
              exit 1
            fi
            counts=$(jq -c --arg name "$name" --argjson number "$number" '. + {($name): $number}' <<<"$counts")
          done < <(jq -r '.checks[] | select(.shards) | [.name, .shards.max, .shards.count] | @tsv' .nexkit/config.json)
          matrix=$(jq -c --argjson counts "$counts" '
            [.checks[] | if .shards then
                (. as $c | $counts[$c.name] as $n | range(1; $n + 1) as $k
                  | ($c | del(.shards)) + {name: "\($c.name)-\($k)", run: "NEXKIT_SHARD=\($k)/\($n) \($c.run)"})
              else . end]
            | reduce .[] as $c ([]; ($c.group // $c.name) as $n
              | if any(.[]; .name == $n) then map(if .name == $n then .checks += [$c] else . end)
                else . + [{name: $n, checks: [$c]}] end)
            | {include: map({
                name,
                checks: [.checks[] | {name, run, timeout_minutes}],
                timeout_minutes: (([.checks[].timeout_minutes] | add) + 15),
                results: ([.checks[] | .results // [] | .[]] | unique | join("\n"))})}' .nexkit/config.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # CI runs one job per check, per group, or per shard of a sharded check of .nexkit/config.json, which
  # the matrix job reads, so a failed NexKit check and the CI job of the same name run the same command.
  checks:
    if: github.event_name != 'schedule'
    needs: matrix
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner image has .NET SDKs, and NexKit's checks use them as they are. When one matches
      # global.json, CI uses it too, so an outage of the SDK download cannot fail the run.
      - name: Find a .NET SDK that matches global.json
        id: sdk
        run: |
          if dotnet --version; then
            echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(command -v dotnet)")")" >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      # Without one, CI downloads the SDK. The download fails at times, so a failed install is
      # tried once more after a pause.
      - id: dotnet
        if: steps.sdk.outputs.found != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        continue-on-error: true
        with:
          global-json-file: global.json
      - if: steps.dotnet.outcome == 'failure'
        run: sleep 60
      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Restores the caches that .nexkit/config.json names and, on main, saves them for NexKit's
      # runs, which only restore. It comes before Setup, so the key files are as committed.
      - uses: phuongnse/nexkit/cache@32ae9b3d2a9eab66e24397fb4bf7d07108ceedb2 # v6.4.0
      - name: Setup
        run: scripts/setup.sh
      # Each check of the entry runs in turn, stopped at its own timeout_minutes. A failed check
      # still lets the next one run, and the job then fails.
      - name: Checks
        env:
          CHECKS: ${{ toJSON(matrix.checks) }}
        run: |
          status=0
          while IFS=$'\t' read -r name minutes command; do
            echo "::group::$name: $command"
            timeout "${minutes}m" bash -c "$command" </dev/null || { echo "::error::Check $name failed"; status=1; }
            echo "::endgroup::"
          done < <(jq -r '.[] | [.name, .timeout_minutes, .run] | @tsv' <<<"$CHECKS")
          exit $status
      - name: Upload test results
        if: ${{ !cancelled() && matrix.results != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.name }}
          path: ${{ matrix.results }}
          if-no-files-found: ignore
          retention-days: 14

  # After every check job of a run on main passed, refreshes the shard durations from the run's JUnit
  # files. It opens or updates one process issue when they drift, and opens one for each test that
  # alone passes the budget. It runs no model and commits nothing (docs/development.md#shards).
  durations:
    name: Shard durations
    needs: checks
    if: ${{ github.ref == 'refs/heads/main' && needs.checks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*
          path: results
      - name: Refresh the shard durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/shard-durations.mjs results "$GITHUB_RUN_ID"

  # Builds the production images and scans them and the identity provider image with Trivy. It fails
  # on a high or critical finding that scripts/scan-images-accepted.json does not cover (D107).
  image-scan:
    name: Image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Trivy's vulnerability database and the pinned Trivy binary. The key changes every day, so the
      # database is fresh once a day and a run restores the newest one before it downloads.
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/trivy
            ~/.cache/axis-tools
          key: ${{ runner.os }}-image-scan-${{ steps.day.outputs.day }}
          restore-keys: ${{ runner.os }}-image-scan-
      - name: Image scan
        run: scripts/scan-images.sh

  # Scans the .NET solution and the npm packages with scripts/scan.sh. It fails on a high or critical
  # finding that scripts/scan-accepted.json does not cover (D107).
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find a .NET SDK that matches global.json
        id: sdk
        run: |
          if dotnet --version; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.sdk.outputs.found != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Dependency scan
        run: scripts/scan.sh
