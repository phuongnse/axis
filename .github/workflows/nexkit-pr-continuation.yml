# Accepted Axis caller; NexKit source is pinned to an immutable release commit.
name: "Axis continue after PR review"
on:
  issue_comment:
    types:
      - "created"
      - "edited"
      - "deleted"
  issues:
    types:
      - "edited"
      - "closed"
  workflow_dispatch:
    inputs:
      issue:
        description: "GitHub issue number"
        type: "string"
        required: true
      pipeline:
        description: "Configured Axis pipeline"
        type: "string"
        required: true
        default: "delivery"
permissions: {}
concurrency:
  group: "nexkit-work"
  queue: "max"
jobs:
  resume:
    if: "github.event_name == 'workflow_dispatch' || (!github.event.issue.pull_request && contains(github.event.issue.body, '<!-- nexkit:pipeline:delivery -->'))"
    uses: "phuongnse/nexkit/.github/workflows/resume-approval.yml@12135708fa35d7471a4127b9a8aaf4c19d834ebd"
    permissions:
      contents: "write"
      issues: "write"
      pull-requests: "write"
      checks: "write"
      actions: "write"
    with:
      kit_repository: "phuongnse/nexkit"
      kit_ref: "12135708fa35d7471a4127b9a8aaf4c19d834ebd"
      pipeline: "delivery"
      gate: "pr-review"
  finish:
    needs: "resume"
    if: "needs.resume.outputs.ready == 'true'"
    uses: "phuongnse/nexkit/.github/workflows/finish-work.yml@12135708fa35d7471a4127b9a8aaf4c19d834ebd"
    permissions:
      contents: "write"
      issues: "write"
      pull-requests: "write"
      checks: "write"
      actions: "write"
    with:
      kit_repository: "phuongnse/nexkit"
      kit_ref: "12135708fa35d7471a4127b9a8aaf4c19d834ebd"
      context_artifact_id: "${{ needs.resume.outputs.context_artifact_id }}"
      checkpoint_evidence: true
      jobs_succeeded: true
