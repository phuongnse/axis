name: Docs audit

# Reads a quarter of the docs against the code and opens a NexKit issue for each finding (D135).
# NexKit starts it on main once every 100 of its merges, and it also runs on demand. NexKit takes
# its issues because autopilot.trusted_workflows lists this file. The audit job runs Claude Code with read-only tools, no GitHub
# token in its checkout and no permission to write; the file job runs no model and only opens
# issues from the findings, so a page that tries to steer the model cannot write to the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read the docs against the code
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      findings: ${{ steps.read.outputs.findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The version NexKit's own runs use, so both read the code the same way.
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.285
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Read this run's pages
        id: read
        # The fallback subscription, which NexKit uses only when the main one is at its limit, so
        # the audit does not take the main one's usage from NexKit's rounds.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_FALLBACK_OAUTH_TOKEN }}
        run: |
          mkdir -p artifacts/docs-audit
          node scripts/docs-audit.mjs pages "$GITHUB_RUN_NUMBER" > artifacts/docs-audit/pages.txt
          node scripts/docs-audit.mjs read "$GITHUB_RUN_NUMBER" > artifacts/docs-audit/findings.json
          {
            echo 'findings<<DOCS_AUDIT_END'
            cat artifacts/docs-audit/findings.json
            echo 'DOCS_AUDIT_END'
          } >> "$GITHUB_OUTPUT"
      - name: Upload the pages and findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-audit
          path: artifacts/docs-audit
          retention-days: 30

  file:
    name: Open the issues
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Open an issue for each new group of findings
        env:
          GH_TOKEN: ${{ github.token }}
          FINDINGS: ${{ needs.audit.outputs.findings }}
        run: |
          printf '%s' "$FINDINGS" > findings.json
          node scripts/docs-audit.mjs file findings.json "$GITHUB_RUN_ID"
