name: Performance

# The performance tests, whose classes end in PerformanceTests, run here and not in CI's integration
# job. They depend on the runner's load, so a timing miss marks only this workflow red (D97). NexKit
# starts it on main every few merges, by merge.after_workflows (D146), and it also runs on demand.
on:
  workflow_dispatch:

permissions:
  contents: read

# A run always finishes: a newer one only replaces a run still waiting.
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  performance:
    name: Performance tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner image has .NET SDKs, and NexKit's checks use them as they are. When one matches
      # global.json, CI uses it too, so an outage of the SDK download cannot fail the run.
      - name: Find a .NET SDK that matches global.json
        id: sdk
        run: |
          if dotnet --version; then
            echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(command -v dotnet)")")" >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      # Without one, CI downloads the SDK. The download fails at times, so a failed install is
      # tried once more after a pause.
      - id: dotnet
        if: steps.sdk.outputs.found != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        continue-on-error: true
        with:
          global-json-file: global.json
      - if: steps.dotnet.outcome == 'failure'
        run: sleep 60
      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Restores the caches that .nexkit/config.json names and, on main, saves them for NexKit's
      # runs, which only restore. It comes before Setup, so the key files are as committed.
      - uses: phuongnse/nexkit/cache@58b3b729b1b2d8e3de9afd6158cd3586f093ec01 # v6.3.1
      - name: Setup
        run: scripts/setup.sh
      - name: Build
        run: scripts/build.sh
      - name: Performance tests
        run: scripts/performance.sh
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-performance
          path: artifacts
          if-no-files-found: ignore
          retention-days: 14
