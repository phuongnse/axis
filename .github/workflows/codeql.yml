name: CodeQL

# Scans the C# and TypeScript code. Alerts go to GitHub code scanning, and the owner sets the
# high-or-critical threshold that fails the check in a repository code scanning rule. NexKit's
# merges start no push workflow, so NexKit starts the scan on main once every 30 of its merges
# (D112). It also scans a person's push to main, pull requests and on demand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner image has .NET SDKs, and NexKit's checks use them as they are. When one matches
      # global.json, the scan uses it too, so an outage of the SDK download cannot fail it.
      - name: Find a .NET SDK that matches global.json
        id: sdk
        if: matrix.build-mode == 'manual'
        run: |
          if dotnet --version; then
            echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(command -v dotnet)")")" >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      # Without one, the scan downloads the SDK. The download fails at times, so a failed
      # install is tried once more after a pause.
      - id: dotnet
        if: matrix.build-mode == 'manual' && steps.sdk.outputs.found != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        continue-on-error: true
        with:
          global-json-file: global.json
      - if: matrix.build-mode == 'manual' && steps.dotnet.outcome == 'failure'
        run: sleep 60
      - if: matrix.build-mode == 'manual' && steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - if: matrix.build-mode == 'manual'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # The same build as scripts/build.sh, after the restores it needs from scripts/setup.sh.
      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          dotnet restore Axis.slnx
          npm ci --prefix web
          scripts/build.sh
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  # NexKit autopilot looks at this run as soon as it ends: a run that NexKit started with
  # the Actions token sends no workflow_run event, but it may dispatch NexKit's sweep.
  nexkit-sweep:
    needs: [analyze]
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      # GitHub's API rejects a dispatch at times with a server error, so a failed dispatch is
      # tried again after a pause. The job fails only when every try fails.
      - run: |
          for attempt in 1 2 3; do
            if gh workflow run nexkit.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f command=autopilot -f number=autopilot -f note="after run $GITHUB_RUN_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
