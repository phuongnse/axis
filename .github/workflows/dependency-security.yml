name: Dependency security

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Locked dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Validate locked process dependency graph
        run: |
          python -m pip install --require-hashes -r requirements/process.txt
          python -m pip check

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Validate NuGet lock graph
        run: python scripts/axis.py check dotnet-dependency-locks

      - name: Restore .NET dependencies
        run: python scripts/axis.py dotnet restore -- --locked-mode

      - name: Audit .NET dependencies
        run: python scripts/axis.py check vulnerable-packages

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: python scripts/axis.py frontend install

      - name: Check exact frontend dependency versions
        run: python scripts/axis.py check frontend-dependency-versions

      - name: Audit frontend dependencies
        run: python scripts/axis.py check frontend-vulnerable-packages
