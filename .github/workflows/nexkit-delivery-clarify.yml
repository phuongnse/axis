# Accepted Axis caller; NexKit source is pinned to an immutable release commit.
name: "Axis delivery clarification"
on:
  issue_comment:
    types:
      - "created"
      - "edited"
      - "deleted"
  issues:
    types:
      - "edited"
      - "closed"
  workflow_dispatch:
    inputs:
      issue:
        description: "GitHub issue number"
        type: "string"
        required: true
      pipeline:
        description: "Configured Axis pipeline"
        type: "string"
        required: true
        default: "delivery"
permissions: {}
jobs:
  discuss:
    if: "github.event_name == 'workflow_dispatch' || (!github.event.issue.pull_request && contains(github.event.issue.body, '<!-- nexkit:pipeline:delivery -->'))"
    uses: "phuongnse/nexkit/.github/workflows/clarify.yml@12135708fa35d7471a4127b9a8aaf4c19d834ebd"
    permissions:
      contents: "write"
      issues: "write"
      actions: "read"
    with:
      kit_repository: "phuongnse/nexkit"
      kit_ref: "12135708fa35d7471a4127b9a8aaf4c19d834ebd"
      pipeline: "delivery"
